[package]
name = "sockat-cli"
version = "0.6.3"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Yoshiaki Kawazu <kawazzz@gmail.com>"]
repository = "https://github.com/kawaz/sockat-rs"
description = "The command sockat: print a path for a Unix domain socket that fits the socket address limit, for a path longer than sun_path allows"
keywords = ["unix", "socket", "sun_path", "uds", "cli"]
categories = ["command-line-utilities", "os::unix-apis"]

[[bin]]
name = "sockat"
path = "src/main.rs"

[dependencies]
# The exact version: the command uses `sockat::__cli`, which is not part of
# the library's API and may change in any release (DR-0033). The command
# has the library's version; `just bump-version` moves both and this pin.
sockat = { path = "..", version = "=0.6.3", features = ["__cli-internal"] }
clap = "4.5"
clap_complete = "4.5"
# 0.11 needs Rust 1.88; the MSRV is 1.85.
sha2 = "0.10"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
