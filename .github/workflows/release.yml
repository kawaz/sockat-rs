name: Release

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
  # A version pushed before this workflow existed (or a release that failed
  # half-way) is released by running it by hand; check-version still refuses a
  # version that is already tagged.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  # Release only what passes CI: the whole suite runs here first (crates.io
  # trusted publishing refuses the workflow_run trigger, so this workflow cannot
  # wait for the CI run of the push instead).
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      checks: write # cargo-audit's check run

  check-version:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.version.outputs.sha }}
      version: ${{ steps.version.outputs.current }}
      changed: ${{ steps.version.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install bump-semver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LATEST=$(gh release list --repo kawaz/bump-semver --limit 1 --json tagName -q '.[0].tagName' | sed 's/^v//')
          curl -fsSL --retry 5 --retry-delay 2 --max-time 60 \
            "https://github.com/kawaz/bump-semver/releases/download/v${LATEST}/bump-semver-linux-amd64" \
            -o /usr/local/bin/bump-semver
          chmod +x /usr/local/bin/bump-semver
          bump-semver --version

      - name: Check version change
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # [package] version = "X.Y.Z" から抽出
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          CURRENT_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "current=${CURRENT_VERSION}" >> "$GITHUB_OUTPUT"

          # semver 形式の検証
          if ! bump-semver get "$CURRENT_VERSION" -qq; then
            echo "::error::Invalid version format in Cargo.toml: ${CURRENT_VERSION}"
            exit 1
          fi

          # 既存 tag より大きいか検証 (二重リリース防止)
          set +e
          LATEST=$(bump-semver vcs get latest-tag --include-prerelease --vcs git 2>/dev/null)
          LATEST_EXIT=$?
          set -e
          if [ "$LATEST_EXIT" -ne 0 ]; then
            echo "vcs get latest-tag exited ${LATEST_EXIT} (no SemVer tags yet); assuming first release"
          else
            set +e
            bump-semver compare gt "$CURRENT_VERSION" "$LATEST"
            CMP_EXIT=$?
            set -e
            case "$CMP_EXIT" in
              0)
                # CURRENT_VERSION > latest tag: release 続行
                ;;
              1)
                # CURRENT_VERSION <= latest tag: 既にリリース済 or 巻き戻し
                echo "changed=false" >> "$GITHUB_OUTPUT"
                echo "Version v${CURRENT_VERSION} is not greater than latest tag ${LATEST}; skipping release."
                exit 0
                ;;
              *)
                echo "::error::Unexpected exit code from bump-semver compare: ${CMP_EXIT}"
                exit 1
                ;;
            esac
          fi

          # gh release で既存確認 (compare で通っても念のため)
          if gh release view "v${CURRENT_VERSION}" --repo "$REPO" >/dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Version v${CURRENT_VERSION} already released; skipping."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "New version detected: v${CURRENT_VERSION}"
          fi

  # The tag and the GitHub release come after the crate is on crates.io, so a
  # failed publish leaves no tag behind and can be retried by hand.
  release:
    needs: [check-version, publish-crate]
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release with tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check-version.outputs.version }}
          COMMIT_SHA: ${{ needs.check-version.outputs.sha }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "v${VERSION}" \
            --repo "$REPO" \
            --title "v${VERSION}" \
            --target "$COMMIT_SHA" \
            --generate-notes

  publish-crate:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.check-version.outputs.sha }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Authenticate with crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish the library to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: cargo publish -p sockat

      # The command after the library: it pins the library at this version,
      # which must be on crates.io first (DR-0033). Trusted publishing can be
      # set up only for a crate that exists, so the first release of
      # sockat-cli is published by hand; until then this step only notes it.
      - name: Publish the command to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: |
          set -euo pipefail
          status=$(curl -s -o /dev/null -w '%{http_code}' -A 'sockat-rs release workflow' https://crates.io/api/v1/crates/sockat-cli)
          if [ "$status" = 404 ]; then
            echo "::notice::sockat-cli is not on crates.io yet: publish its first release by hand (cargo publish -p sockat-cli), then add the trusted publisher"
            exit 0
          fi
          cargo publish -p sockat-cli
