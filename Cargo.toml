[package]
name = "sockat"
version = "0.6.2"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Yoshiaki Kawazu <kawazzz@gmail.com>"]
repository = "https://github.com/kawaz/sockat-rs"
description = "Bind and connect Unix domain sockets whose path is longer than sun_path allows"
keywords = ["unix", "socket", "sun_path", "uds"]
categories = ["os::unix-apis", "network-programming"]
readme = "README.md"
# What goes into the published crate: the code and what docs.rs / crates.io
# show. Repository tooling (CI, justfile, agent rules), the design docs and
# the command (cli/) stay in the repository.
include = ["/src/**", "/README.md", "/LICENSE", "/Cargo.toml"]

# The library stays at the root (where the published package has always
# been); the command `sockat` is the package sockat-cli in cli/ (DR-0033).
[workspace]
members = [".", "cli"]

[features]
# For the command sockat (sockat-cli) only: makes `sockat::__cli` public, the
# entry it makes and checks B through. Not part of the API, promises nothing,
# do not use it (DR-0033). Adds no dependency.
__cli-internal = []

[dependencies]
libc = "0.2"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["net", "rt", "io-util", "macros"] }

# The conformance CLI the hub's conformance test runs (DR-0030), built by
# `just conformance`; not in the published crate (`include` leaves examples/
# out).
[[example]]
name = "conformance"
