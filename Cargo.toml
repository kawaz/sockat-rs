[package]
name = "sockat"
version = "0.2.5"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Yoshiaki Kawazu <kawazzz@gmail.com>"]
repository = "https://github.com/kawaz/sockat-rs"
description = "Bind and connect Unix domain sockets whose path is longer than sun_path allows"
keywords = ["unix", "socket", "sun_path", "uds"]
categories = ["os::unix-apis", "network-programming"]
readme = "README.md"
# What goes into the published crate: the code and what docs.rs / crates.io
# show. Repository tooling (CI, justfile, agent rules) and the design docs stay
# in the repository.
include = ["src/**", "README.md", "LICENSE", "Cargo.toml"]

[dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["net", "rt", "io-util", "macros"] }
